<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Neshama student portal</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a2b;--card:#16263d;--ink:#f4efe4;--muted:#a9b6c8;--gold:#f2b84b;--line:#2b4162}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.55;padding:24px 20px calc(40px + env(safe-area-inset-bottom,0px))}
.w{max-width:560px;margin:0 auto}
.brand{text-align:center;margin-bottom:10px}.logo{max-height:80px;max-width:70%;width:auto}.bname{font-weight:800;font-size:22px;color:var(--gold)}
h1{font-size:28px;line-height:1.15;font-weight:800;margin:14px 0 10px}
p{color:var(--muted);font-size:17px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:15px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{display:block;width:100%;margin-top:20px;padding:16px;border:0;border-radius:99px;background:var(--gold);color:#14233a;font:800 17px inherit;cursor:pointer}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;display:block;margin:16px auto 0;cursor:pointer}
.err{color:#ff8a7a;font-size:14px;min-height:18px;margin-top:10px}
.tag{display:inline-block;background:var(--gold);color:#14233a;font-weight:800;font-size:13px;border-radius:99px;padding:3px 12px;margin-bottom:8px}
.yt{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;margin:14px 0}
.yt iframe{width:100%;height:100%;border:0}
.hid{display:none}
.yt{position:relative}
#ov{position:absolute;inset:0;z-index:2;cursor:pointer}
.yt:fullscreen{border-radius:0;aspect-ratio:auto;margin:0}
.yt:-webkit-full-screen{border-radius:0;aspect-ratio:auto;margin:0}
.ctl{display:flex;gap:10px;margin:0 0 12px}
.ctlb{flex:1;padding:12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="w">
  <div class="brand"><img class="logo" src="logo.png" alt="Neshama Leadership Institute" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="bname" style="display:none">Neshama Leadership Institute</span></div>
  <h1>Student portal</h1>

  <form class="card" id="login" novalidate>
    <label for="id">Email or student ID</label><input id="id" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="go" type="submit">Sign in</button>
    <button class="link" id="fg" type="button">Forgot password or first time here?</button>
  </form>

  <form class="card hid" id="setup" novalidate>
    <p style="margin-top:0">Choose your password. Use at least 8 characters.</p>
    <label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password">
    <label for="p2">Repeat password</label><input id="p2" type="password" autocomplete="new-password">
    <div class="err" id="err2" role="alert"></div>
    <button class="btn" id="sv" type="submit">Save password and sign in</button>
  </form>

  <div id="view" class="hid">
    <p id="hi"></p>
    <div class="card hid" id="livecard">
      <span class="tag" id="livetag"></span>
      <h2 id="livetitle" style="margin:4px 0 0;font-size:24px"></h2>
      <div class="yt" id="livebox"></div>
      <p id="livenote" style="margin:0"></p>
    </div>
    <div class="card" id="lcard">
      <span class="tag" id="tag"></span>
      <h2 id="title" style="margin:4px 0 0;font-size:24px"></h2>
      <div class="yt" id="ytbox"></div>
      <div class="ctl hid" id="ctl"><button class="ctlb" id="pp" type="button">Play</button><button class="ctlb" id="fsb" type="button">Fullscreen</button></div>
      <p id="left" style="margin:0"></p>
      <p id="notes" style="margin:10px 0 0"></p>
      <div class="hid" id="quizbox" style="margin-top:14px"><p id="qtxt" style="color:var(--ink);margin:0"></p><a class="btn" id="quizlink" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;margin-top:10px">Take the quiz</a></div>
    </div>
    <div class="card hid" id="msg"><p id="msgtxt" style="margin:0"></p></div>
    <button class="btn" id="gbtn" type="button">My results</button>
    <div class="card hid" id="gcard" style="margin-top:16px"></div>
    <button class="link" id="out" type="button">Sign out</button>
  </div>
</div>

<script>
var SCRIPT_URL='PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
var liveTimer=null,liveId='';
var tok=null,$=function(i){return document.getElementById(i)};
function api(p){return fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).then(function(r){return r.json()})}
function show(v){['login','setup','view'].forEach(function(x){$(x).classList.toggle('hid',x!==v)})}
function fmt(iso){return new Date(iso).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function savePdf(r){var b=atob(r.data),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));a.download=r.filename;document.body.appendChild(a);a.click();a.remove()}

function logout(msg){tok=null;clearInterval(liveTimer);liveId='';$('livebox').innerHTML='';$('livecard').classList.add('hid');try{sessionStorage.removeItem('abs')}catch(e){}
  $('ytbox').innerHTML='';$('gcard').classList.add('hid');$('pw').value='';show('login');$('err').textContent=msg||''}

function begin(r){tok=r.token;
  try{sessionStorage.setItem('abs',JSON.stringify({t:r.token,n:r.name,i:r.studentId}))}catch(e){}
  $('hi').textContent='Welcome, '+(r.name||'student')+' · Student ID '+r.studentId;
  show('view');loadLesson();startLive()}

function loadLesson(){api({action:'lesson',token:tok}).then(function(r){
  if(r.expired)return logout(r.error);
  var open=r.state==='open';
  $('lcard').classList.toggle('hid',!open);$('msg').classList.toggle('hid',open);
  if(open){
    $('tag').textContent='Lesson '+r.lesson+' of '+r.total;$('title').textContent=r.title;
    if(ytReady)mountPlayer(r);else pendingLesson=r;
    var days=Math.max(1,Math.ceil((new Date(r.closes)-new Date())/864e5));
    $('left').textContent='This lesson is open for '+days+' more day'+(days>1?'s':'')+'. It closes on '+fmt(r.closes)+'.';
    $('notes').textContent=r.notes||'';
  }else $('msgtxt').textContent=r.state==='notstarted'?'Your batch begins on '+fmt(r.opens)+'. Come back then to start Lesson 1.'
    :r.state==='nobatch'?'You have not been placed in a batch yet. The school will contact you.'
    :'You have completed all lessons for this batch. Thank you for studying with us.';
}).catch(function(){$('msgtxt').textContent='Connection problem. Please refresh.';$('msg').classList.remove('hid')})}

$('login').addEventListener('submit',function(e){e.preventDefault();
  var id=$('id').value.trim(),pw=$('pw').value;
  if(!id||!pw){$('err').textContent='Enter your email or student ID and your password.';return}
  var b=$('go');b.disabled=true;b.textContent='Signing in…';$('err').textContent='';
  api({action:'login',id:id,password:pw}).then(function(r){
    if(!r.ok)$('err').textContent=r.error;else{$('pw').value='';begin(r)}
  }).catch(function(){$('err').textContent='Connection problem. Please try again.'})
  .then(function(){b.disabled=false;b.textContent='Sign in'})});

$('fg').addEventListener('click',function(){
  var id=$('id').value.trim();if(!id){$('err').textContent='Type your email or student ID above first.';return}
  api({action:'forgot',id:id}).then(function(r){$('err').style.color='var(--gold)';$('err').textContent=r.message||r.error;setTimeout(function(){$('err').style.color=''},6000)})});

var act=new URLSearchParams(location.search).get('activate');
$('setup').addEventListener('submit',function(e){e.preventDefault();
  if($('p1').value.length<8){$('err2').textContent='Use at least 8 characters.';return}
  if($('p1').value!==$('p2').value){$('err2').textContent='The two passwords do not match.';return}
  var b=$('sv');b.disabled=true;
  api({action:'activate',activationToken:act,password:$('p1').value}).then(function(r){
    if(!r.ok){$('err2').textContent=r.error;b.disabled=false;return}
    history.replaceState(null,'',location.pathname);$('p1').value=$('p2').value='';begin(r)
  }).catch(function(){$('err2').textContent='Connection problem. Please try again.';b.disabled=false})});

$('gbtn').addEventListener('click',function(){
  var g=$('gcard');if(!g.classList.contains('hid')){g.classList.add('hid');return}
  api({action:'grades',token:tok}).then(function(r){
    if(r.expired)return logout(r.error);
    g.textContent='';
    if(!r.records.length)g.textContent='No results have been entered yet.';
    else{
      var h=document.createElement('h2');h.style.cssText='margin:0 0 6px;font-size:22px';h.textContent='Average '+r.summary.average+' (pass mark '+r.passMark+')';g.appendChild(h);
      var s=document.createElement('p');s.textContent=r.summary.passed+' of '+r.summary.courses+' courses passed · Attendance '+r.summary.attendance+'%';g.appendChild(s);
      r.records.forEach(function(x){var d=document.createElement('p');d.style.color='var(--ink)';
        d.textContent=x.title+' ('+x.term+'): '+x.score+' ('+x.grade+'), '+(x.pass?'Pass':'Fail')+', attendance '+x.attendance+'%';g.appendChild(d)});
      var t=document.createElement('button');t.className='btn';t.type='button';t.textContent='Download transcript (PDF)';
      t.onclick=function(){t.disabled=true;t.textContent='Preparing…';
        api({action:'transcript',token:tok}).then(function(x){if(x.ok)savePdf(x);else alert(x.error)})
        .catch(function(){alert('Connection problem. Please try again.')}).then(function(){t.disabled=false;t.textContent='Download transcript (PDF)'})};
      g.appendChild(t)}
    g.classList.remove('hid')}).catch(function(){g.textContent='Connection problem. Please try again.';g.classList.remove('hid')})});

$('out').addEventListener('click',function(){logout('')});


// YouTube player: no skipping ahead, custom controls, end-of-video detection
var ytPlayer=null,ytReady=false,pendingLesson=null,maxT=0,poll=null;
(function(){var t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t)})();
function onYouTubeIframeAPIReady(){ytReady=true;if(pendingLesson)mountPlayer(pendingLesson)}
function ytToggle(){try{if(ytPlayer.getPlayerState()===1)ytPlayer.pauseVideo();else ytPlayer.playVideo()}catch(e){}}
function ytFs(){var b=$('ytbox');
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  else{var f=b.requestFullscreen||b.webkitRequestFullscreen;if(f)f.call(b)}}
function guard(){try{var t=ytPlayer.getCurrentTime();if(t>maxT+2)ytPlayer.seekTo(maxT,true);else if(t>maxT)maxT=t}catch(e){}}
function mountPlayer(r){
  pendingLesson=null;maxT=0;clearInterval(poll);
  $('ytbox').innerHTML='<div id="ytp"></div><div id="ov"></div>';
  $('quizbox').classList.add('hid');$('ctl').classList.remove('hid');$('pp').textContent='Play';
  $('fsb').style.display=(document.fullscreenEnabled||document.webkitFullscreenEnabled)?'':'none';
  $('ov').onclick=ytToggle;
  ytPlayer=new YT.Player('ytp',{width:'100%',height:'100%',videoId:r.videoId,
    playerVars:{controls:0,disablekb:1,fs:0,rel:0,iv_load_policy:3,playsinline:1},
    events:{onStateChange:function(e){
      $('pp').textContent=e.data===1?'Pause':'Play';
      if(e.data===0){clearInterval(poll);showQuiz(r)}
      if(e.data===1){clearInterval(poll);poll=setInterval(guard,500)}
    },onError:function(){showQuiz(r)}}});
}
$('pp').addEventListener('click',ytToggle);
$('fsb').addEventListener('click',ytFs);
function showQuiz(r){
  var ok=r.quiz&&/^https:\/\/(forms\.gle|docs\.google\.com\/forms)\//.test(r.quiz);
  $('qtxt').textContent=ok?'Lesson completed. Now test what you learned.':'Lesson completed. Well done.';
  var a=$('quizlink');a.style.display=ok?'block':'none';if(ok)a.href=r.quiz;
  $('quizbox').classList.remove('hid');
}


// Live class (YouTube live stream), shown only to the student's batch during the live window
function fmtTime(iso){return new Date(iso).toLocaleString(undefined,{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit'})}
function loadLive(){api({action:'live',token:tok}).then(function(r){
  if(r.expired)return logout(r.error);
  var c=$('livecard'),show=r.state==='live'||r.state==='upcoming';
  c.classList.toggle('hid',!show);
  if(!show){$('livebox').innerHTML='';liveId='';return}
  $('livetag').textContent=r.state==='live'?'LIVE NOW':'Upcoming live class';
  $('livetitle').textContent=r.title||'Live class';
  if(r.state==='live'){
    $('livebox').style.display='block';
    if(liveId!==r.videoId){liveId=r.videoId;
      $('livebox').innerHTML='<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(r.videoId)+'?rel=0&playsinline=1" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Live class"></iframe>'}
    $('livenote').textContent='Watching live. There may be a delay of about 20 seconds behind the class.';
  }else{
    $('livebox').style.display='none';$('livebox').innerHTML='';liveId='';
    $('livenote').textContent='Starts '+fmtTime(r.starts)+' (your local time). This page opens the stream 15 minutes before.';
  }
}).catch(function(){})}
function startLive(){loadLive();clearInterval(liveTimer);liveTimer=setInterval(loadLive,60000)}

// Start: activation link, saved session, or sign-in form
if(act){show('setup')}
else{try{var s=JSON.parse(sessionStorage.getItem('abs')||'null');
  if(s){tok=s.t;$('hi').textContent='Welcome, '+(s.n||'student')+' · Student ID '+s.i;show('view');loadLesson();startLive()}}catch(e){}}
</script>
</body>
</html>
