<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Neshamah assessments</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a2b;--card:#16263d;--ink:#f4efe4;--muted:#a9b6c8;--gold:#f2b84b;--line:#2b4162}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.55;padding:24px 20px calc(40px + env(safe-area-inset-bottom,0px))}
.w{max-width:560px;margin:0 auto}
.brand{text-align:center;margin-bottom:10px}.logo{max-height:80px;max-width:70%;width:auto}.bname{font-weight:800;font-size:22px;color:var(--gold)}
h1{font-size:28px;line-height:1.15;font-weight:800;margin:14px 0 10px}
p{color:var(--muted);font-size:17px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:21px;color:var(--gold)}.card p{font-size:16px;margin:0}
label{display:block;font-weight:600;margin:6px 0;font-size:15px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{display:block;width:100%;margin-top:16px;padding:16px;border:0;border-radius:99px;background:var(--gold);color:#14233a;font:800 17px inherit;text-align:center;text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;display:block;margin:16px auto 0;cursor:pointer}
.err{color:#ff8a7a;font-size:14px;min-height:18px;margin-top:10px}
.hid{display:none}
</style>
</head>
<body>
<div class="w">
  <div class="brand"><img class="logo" src="logo.png" alt="Neshamah Leadership Institute" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="bname" style="display:none">Neshamah Leadership Institute</span></div>
  <h1>Leadership assessments</h1>

  <form class="card" id="f" novalidate>
    <p style="margin-bottom:12px">Enter the access code the school sent you by email or WhatsApp. Codes work for 24 hours.</p>
    <label for="c">Access code</label>
    <input id="c" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="NLI-XXXX-XXXX">
    <div class="err" id="err" role="alert"></div>
    <button class="btn" id="go" type="submit">Continue</button>
  </form>

  <div id="list" class="hid">
    <p id="hi"></p>
    <div id="cards"></div>
    <p id="exp" style="font-size:14px"></p>
    <button class="link" id="out" type="button">Use a different code</button>
  </div>
</div>

<script>
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbxq2Nj6UZu2Nm3CKtShGM5Ipz6tWEX6RE3zT21g05pbn5-WfDUSOD8vGWbBNYRxa0Co/exec';
var $=function(i){return document.getElementById(i)};
var KINDS={
  disc:{t:'DISC Leadership Profile',u:'disc.html',d:'Discover your natural leadership and communication style.'},
  eq:{t:'Emotional Intelligence',u:'eq.html',d:'See how you read and manage emotions in yourself and others.'},
  strengths:{t:'Strengths Compass',u:'strengths.html',d:'Find the strengths that guide how you lead.'},
  johari:{t:'Johari Window',u:'johari.html',d:'Compare how you see yourself with how colleagues see you.'},
  blackout:{t:'Blackout Index',u:'blackout.html',d:'Test how your team would perform if you were unavailable for 48 hours.'}
};
function show(m){
  $('f').classList.add('hid');$('list').classList.remove('hid');
  $('hi').textContent='Welcome, '+m.name+'. Choose an assessment.';
  var c=$('cards');c.textContent='';
  m.allowed.forEach(function(k){var x=KINDS[k];if(!x)return;
    var d=document.createElement('div');d.className='card';
    var h=document.createElement('h2');h.textContent=x.t;var p=document.createElement('p');p.textContent=x.d;
    var a=document.createElement('a');a.className='btn';a.href=x.u;a.textContent='Start';
    d.appendChild(h);d.appendChild(p);d.appendChild(a);c.appendChild(d)});
  $('exp').textContent='Your access ends '+new Date(m.expires).toLocaleString(undefined,{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit'})+'.';
}
function clear(){try{sessionStorage.removeItem('nli_access');sessionStorage.removeItem('nli_meta')}catch(e){}
  $('list').classList.add('hid');$('f').classList.remove('hid');$('c').value=''}
$('f').addEventListener('submit',function(e){e.preventDefault();
  var code=$('c').value.trim();if(!code){$('err').textContent='Enter your access code.';return}
  var b=$('go');b.disabled=true;b.textContent='Checking…';$('err').textContent='';
  fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({fn:'accessRedeem',code:code})}).then(function(r){return r.json()}).then(function(r){
    if(!r.ok){$('err').textContent=r.error||'That code is not valid.';return}
    try{sessionStorage.setItem('nli_access',r.data.token);sessionStorage.setItem('nli_meta',JSON.stringify(r.data))}catch(x){}
    show(r.data);
  }).catch(function(){$('err').textContent='Connection problem. Please try again.'})
  .then(function(){b.disabled=false;b.textContent='Continue'})});
$('out').addEventListener('click',clear);
try{var m=JSON.parse(sessionStorage.getItem('nli_meta')||'null');
  if(m&&sessionStorage.getItem('nli_access')&&new Date(m.expires)>new Date())show(m)}catch(e){}
</script>
</body>
</html>
